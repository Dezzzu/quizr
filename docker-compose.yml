services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: quizr
      POSTGRES_PASSWORD: quizr
      POSTGRES_DB: quizr
    ports:
      - "5432:5432"
    volumes:
      # Single top-level mount, not .../data — postgres 18's image switched to a
      # pg_ctlcluster-compatible, version-namespaced layout under /var/lib/postgresql
      # and refuses to start against the old .../data-style mount point.
      - quizr-postgres:/var/lib/postgresql

volumes:
  quizr-postgres:
