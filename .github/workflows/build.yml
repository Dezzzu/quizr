name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      # Directory.Build.props sets TreatWarningsAsErrors, so this also enforces
      # the analyzer rules from .editorconfig.
      - name: Build
        run: dotnet build --no-restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Domain tests
        run: dotnet test --project tests/Quizr.Domain.Tests --no-build

      - name: App tests
        run: dotnet test --project tests/Quizr.App.Tests --no-build

      # Catches a broken Dockerfile on every push, independent of the dotnet build
      # above — a change here (a moved project, a renamed csproj) can break the
      # image without breaking `dotnet build`. Doesn't push anywhere; picking a
      # registry is a deployment decision, not a CI one.
      - name: Build Docker image
        run: docker build -t quizr:ci .
