name: build and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      # Directory.Build.props sets TreatWarningsAsErrors, so this also enforces
      # the analyzer rules from .editorconfig.
      - name: Build
        run: dotnet build --no-restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Domain tests
        run: dotnet test --project tests/Quizr.Domain.Tests --no-build

      - name: App tests
        run: dotnet test --project tests/Quizr.App.Tests --no-build

      # Catches a broken Dockerfile on every push, independent of the dotnet build
      # above — a change here (a moved project, a renamed csproj) can break the
      # image without breaking `dotnet build`. Pull requests stop here; the deploy
      # job below is what builds the image that actually ships.
      - name: Build Docker image
        run: docker build -t quizr:ci .

  # Builds on GitHub's runners rather than the VPS: the .NET SDK image is over a
  # gigabyte and a restore-and-publish is a poor use of a small server. Coolify
  # only ever pulls the finished image. See DEPLOY.md for the Coolify side.
  deploy:
    # Only from main, and only once the job above has actually passed — a failing
    # test must never reach the bot.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    # COOLIFY_WEBHOOK and COOLIFY_TOKEN live on this environment, not on the
    # repository. A job that doesn't name the environment cannot see its secrets
    # and reads them as empty strings, which is how the first deploy handed curl
    # an empty URL rather than saying anything was missing.
    environment: prod

    permissions:
      contents: read
      # Pushing to GHCR under this repository's own namespace, which is why no
      # registry credentials are needed beyond the token GitHub already issues.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name for us — GHCR rejects the
      # capital in the owner that github.repository would otherwise carry through.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # The commit-sha tag is what makes a rollback possible: point Coolify at a
      # specific one and redeploy, rather than hunting for which build "latest"
      # happens to be.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A GET carrying a bearer token is the shape Coolify's own GitHub Actions
      # guide documents. --fail turns a rejected webhook into a red build instead
      # of a green one that quietly deployed nothing.
      #
      # Read through env rather than interpolated into the script: an unset secret
      # expands to an empty string, and `curl ''` fails with a bare "malformed
      # URL" that says nothing about which secret is missing or that the image
      # was pushed regardless. Checking first turns that into an answer.
      - name: Trigger Coolify deploy
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "::error::COOLIFY_WEBHOOK and COOLIFY_TOKEN are not set, so nothing was deployed. The image was still built and pushed to ghcr.io, so a manual redeploy in Coolify will pick it up. See DEPLOY.md for both values."
            exit 1
          fi

          # Host and path only: enough to see which endpoint was called without
          # putting the resource uuid in the log, and nothing of the token.
          echo "calling $(printf '%s' "$WEBHOOK" | sed -E 's#\?.*##')"

          # POST rather than GET. Coolify documents /api/v1/deploy as accepting
          # both, and both answer 401 unauthenticated on this instance, so the
          # method was never the constraint — but an authenticated GET returned
          # 405 here, and POST is the method that actually describes what this
          # does, so it is the one worth being on.
          status=$(curl --silent --show-error --output response.txt \
            --write-out '%{http_code}' \
            --request POST "$WEBHOOK" \
            --header "Authorization: Bearer $TOKEN")

          # --fail hid this: it collapses every failure into an exit code and
          # throws away the body, which is where Coolify says what it objected to.
          echo "status: $status"
          echo "response: $(head -c 500 response.txt)"

          case "$status" in
            2*) ;;
            401) echo "::error::Coolify rejected COOLIFY_TOKEN (401). Check it has deploy permission and has not been revoked." ; exit 1 ;;
            404 | 405) echo "::error::Coolify would not accept this URL ($status). COOLIFY_WEBHOOK should be the 'Deploy Webhook (auth required)' from the application's Webhooks tab, containing /api/v1/deploy?uuid=." ; exit 1 ;;
            *) echo "::error::Coolify returned $status. The response body is above." ; exit 1 ;;
          esac
