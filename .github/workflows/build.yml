name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      # Directory.Build.props sets TreatWarningsAsErrors, so this also enforces
      # the analyzer rules from .editorconfig.
      - name: Build
        run: dotnet build --no-restore

      - name: Check formatting
        run: dotnet csharpier check .

      # `dotnet test` reports "Zero tests ran" with xUnit v3 on this SDK — see
      # STACK.md. The assemblies run their tests correctly when executed directly.
      - name: Domain tests
        run: dotnet run --project tests/Quizr.Domain.Tests --no-build

      - name: App tests
        run: dotnet run --project tests/Quizr.App.Tests --no-build
