# Grafana Alloy, shipping every container's stdout on this host to Grafana Cloud Loki.
#
# The Alloy config lives beside this file, in alloy.alloy, and is bind-mounted in. That works
# because relative paths resolve against compose's *project* directory, and Coolify runs this
# with `--project-directory <base directory>` — the observability/ folder.
#
# So deploy it as a repository-backed application with base directory observability/, and not
# as Coolify's standalone Docker Compose resource. That one has no repository behind it, so
# there is no alloy.alloy to mount; Docker then creates a directory at the missing source path
# and refuses to mount it over a file, which is what an OCI "not a directory" error means.
#
# The three LOKI_* values come from Grafana Cloud -> Connections -> Loki, and are a different
# id and token from the OTLP ones the bot itself uses. Set them on the resource in Coolify;
# they are read here rather than written down, so this file holds no secret.

services:
  alloy:
    # Pinned rather than :latest, for the reason DEPLOY.md pins the bot's own image: a
    # silently-updated agent is a silently-changed config language. v1.19.2 is >= 1.0, which
    # is what makes `sys.env(...)` in the config below the correct spelling.
    image: grafana/alloy:v1.19.2
    restart: unless-stopped

    # Reading other containers' logs means reading the Docker socket, and the socket is root
    # on the host by ownership — so this container runs as root where the bot deliberately
    # does not (see the Dockerfile). Read-only limits what it can *do* with the socket, not
    # what it can see: every container's logs on this host are in scope, which is the point,
    # but worth knowing before adding anything else to this file. If that trade isn't
    # acceptable, Docker's own Loki logging driver ships logs without a socket mount at all.
    user: root

    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    volumes:
      # Relative to the *project* directory, not to this file. Coolify runs compose with
      # `--project-directory <base directory>`, which for this resource is the observability/
      # folder this file lives in — so `./alloy.alloy` is the file sitting beside it. Run it by
      # hand the same way and the same path holds:
      #   docker compose --project-directory observability -f observability/docker-compose.yml up
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

    environment:
      LOKI_URL: ${LOKI_URL}
      LOKI_USERNAME: ${LOKI_USERNAME}
      LOKI_PASSWORD: ${LOKI_PASSWORD}

    # No ports. Alloy's debug UI is on 12345 and is worth forwarding *temporarily* while
    # working out why a pipeline is silent, but it exposes the running config, so it has no
    # business being published.

volumes:
  # Spelled out rather than left null. `alloy-data:` with no value is valid compose and means
  # "default driver", but it parses to a null, and a consumer that iterates volumes expecting
  # a mapping trips over it. Costs one line to not find out which ones do.
  alloy-data:
    driver: local
