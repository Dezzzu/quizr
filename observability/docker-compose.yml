# Grafana Alloy, shipping every container's stdout on this host to Grafana Cloud Loki.
#
# Add it in Coolify as a *Docker Compose* resource pointing at this repository with base
# directory `observability/`, so this file and the `alloy.alloy` it mounts stay next to each
# other and in version control. The alternative — pasting a compose file into a UI textarea —
# leaves the only working copy on the server, which is the wrong place for a config that is
# still being tuned.
#
# The three LOKI_* values come from Grafana Cloud -> Connections -> Loki, and are a different
# id and token from the OTLP ones the bot itself uses. Set them on the resource in Coolify;
# they are read here rather than written down, so this file holds no secret.
#
# Smoke-test the config with `docker run` before making it a managed resource — see DEPLOY.md.

services:
  alloy:
    # Pinned rather than :latest, for the reason DEPLOY.md pins the bot's own image: a
    # silently-updated agent is a silently-changed config language. v1.19.2 is >= 1.0, which
    # is what makes `sys.env(...)` in alloy.alloy the correct spelling.
    image: grafana/alloy:v1.19.2
    restart: unless-stopped

    # Reading other containers' logs means reading the Docker socket, and the socket is root
    # on the host by ownership — so this container runs as root where the bot deliberately
    # does not (see the Dockerfile). Read-only limits what it can *do* with the socket, not
    # what it can see: every container's logs on this host are in scope, which is the point,
    # but worth knowing before adding anything else to this file. If that trade isn't
    # acceptable, Docker's own Loki logging driver ships logs without a socket mount at all.
    user: root

    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

    environment:
      LOKI_URL: ${LOKI_URL}
      LOKI_USERNAME: ${LOKI_USERNAME}
      LOKI_PASSWORD: ${LOKI_PASSWORD}

    # No ports. Alloy's debug UI is on 12345 and is worth forwarding *temporarily* while
    # working out why a pipeline is silent, but it exposes the running config, so it has no
    # business being published.

volumes:
  alloy-data:
