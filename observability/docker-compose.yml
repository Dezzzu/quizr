# Grafana Alloy, shipping every container's stdout on this host to Grafana Cloud Loki.
#
# Self-contained on purpose: the Alloy config is embedded below rather than bind-mounted from
# a file beside this one. A bind mount ties the file to Coolify's Base Directory setting —
# relative paths resolve against the *project* directory, not against this file — and getting
# the two out of step produces errors that name neither cause: "Failed to read the Docker
# Compose file" when the path is wrong, and an OCI "not a directory" when Docker invents a
# directory at a bind source that doesn't exist. With the config inline there is no second
# file and no path to agree on, so this works pasted into Coolify's standalone Docker Compose
# resource, deployed from the repository, or run by hand with `docker compose up` from any
# directory.
#
# This file is therefore the one source of truth for the Alloy config. Edit it here.
#
# The three LOKI_* values come from Grafana Cloud -> Connections -> Loki, and are a different
# id and token from the OTLP ones the bot itself uses. Set them on the resource in Coolify;
# they are read here rather than written down, so this file holds no secret.

services:
  alloy:
    # Pinned rather than :latest, for the reason DEPLOY.md pins the bot's own image: a
    # silently-updated agent is a silently-changed config language. v1.19.2 is >= 1.0, which
    # is what makes `sys.env(...)` in the config below the correct spelling.
    image: grafana/alloy:v1.19.2
    restart: unless-stopped

    # Reading other containers' logs means reading the Docker socket, and the socket is root
    # on the host by ownership — so this container runs as root where the bot deliberately
    # does not (see the Dockerfile). Read-only limits what it can *do* with the socket, not
    # what it can see: every container's logs on this host are in scope, which is the point,
    # but worth knowing before adding anything else to this file. If that trade isn't
    # acceptable, Docker's own Loki logging driver ships logs without a socket mount at all.
    user: root

    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

    environment:
      LOKI_URL: ${LOKI_URL}
      LOKI_USERNAME: ${LOKI_USERNAME}
      LOKI_PASSWORD: ${LOKI_PASSWORD}

    # No ports. Alloy's debug UI is on 12345 and is worth forwarding *temporarily* while
    # working out why a pipeline is silent, but it exposes the running config, so it has no
    # business being published.

configs:
  alloy_config:
    content: |
      // Ships every container's stdout on this host to Grafana Cloud Loki.
      //
      // Log shipping is an agent's job rather than the bot's own, deliberately. The app already
      // writes structured JSON to stdout (Program.cs picks the JSON formatter whenever output is
      // redirected, which it always is under Docker), so Docker has the logs whether or not the app
      // is healthy — including a startup crash that happens before any exporter exists, and
      // including Postgres, whose own ERROR lines were half the evidence during the announcement
      // incident. An OTLP log exporter inside the app would have neither.
      //
      // Verified against a live Coolify host on Alloy v1.19.2 — the version docker-compose.yml
      // beside this pins, and what makes `sys.env(...)` below the right spelling (before 1.0 it is
      // `env(...)`).

      discovery.docker "containers" {
      	host = "unix:///var/run/docker.sock"
      }

      // Names the log stream after the thing being deployed, not after the container running it.
      //
      // Coolify names containers `<resource-uuid>-<deploy-timestamp>`, e.g.
      // `rrnw2v5key9vfuhdwyukwmhh-125121626027`. Both halves are hostile as a Loki label: the
      // timestamp changes on every deploy, so labelling by container name mints a brand-new stream
      // each time — no query or alert written today still matches tomorrow, and the stream count
      // climbs forever. The uuid is stable but tells nobody which container it is.
      //
      // So this is a cascade, relying on relabel's own semantics: the rules run in order, a later
      // one overwrites an earlier one, and a `replace` whose regex doesn't match is simply a no-op.
      // Each rule is therefore a preference, and the first is the guaranteed floor.
      discovery.relabel "containers" {
      	targets = discovery.docker.containers.targets

      	// Floor: the container name minus Docker's leading slash. Always matches, always sets
      	// something, so a container Coolify didn't create still reaches Loki with a label.
      	rule {
      		source_labels = ["__meta_docker_container_name"]
      		regex         = "/(.*)"
      		target_label  = "container"
      	}

      	// Better: drop Coolify's deploy-timestamp suffix. Still opaque, but stable across
      	// deploys, which is the half that actually breaks queries.
      	rule {
      		source_labels = ["__meta_docker_container_name"]
      		// [0-9] rather than \d: Alloy strings take Go-style escapes, so a backslash class
      		// would have to be written doubled, and this needs no escaping to be read correctly.
      		regex         = "/(.+)-[0-9]+"
      		target_label  = "container"
      	}

      	// Best: what the resource is called in Coolify — "quizr-bot", not a uuid. Written twice
      	// because Docker label names are sanitised into meta-label names by replacing invalid
      	// characters, and whether the original camelCase survives depends on the discovery
      	// implementation. Only one of these can match; the other is a no-op, so covering both
      	// costs nothing and saves finding out the hard way on a version bump.
      	rule {
      		source_labels = ["__meta_docker_container_label_coolify_resourcename"]
      		regex         = "(.+)"
      		target_label  = "container"
      	}

      	rule {
      		source_labels = ["__meta_docker_container_label_coolify_resourceName"]
      		regex         = "(.+)"
      		target_label  = "container"
      	}
      }

      loki.source.docker "containers" {
      	host       = "unix:///var/run/docker.sock"
      	targets    = discovery.relabel.containers.output
      	forward_to = [loki.process.quizr.receiver]
      }

      // Lifts the fields .NET's JsonConsoleFormatter writes so LogQL can filter on them without
      // re-parsing every line. Only LogLevel becomes a label: labels are an index, and Message or
      // Exception would be unbounded. The rest stays queryable inside the line itself.
      loki.process "quizr" {
      	stage.json {
      		expressions = {
      			level    = "LogLevel",
      			category = "Category",
      		}
      	}

      	stage.labels {
      		values = {
      			level = "",
      		}
      	}

      	forward_to = [loki.write.grafana_cloud.receiver]
      }

      loki.write "grafana_cloud" {
      	endpoint {
      		url = sys.env("LOKI_URL")

      		basic_auth {
      			username = sys.env("LOKI_USERNAME")
      			password = sys.env("LOKI_PASSWORD")
      		}
      	}
      }

volumes:
  alloy-data:
